#!/usr/bin/env python3
# CLI wrapper to generate and preview the master record
from copyright_master_morley_apooch import export_json, export_markdown, get_master_record
import argparse
import subprocess
import os
import sys

def main():
    parser = argparse.ArgumentParser(description="Generate Morley Apooch master copyright record")
    parser.add_argument("--json", action="store_true", help="Export JSON")
    parser.add_argument("--md", action="store_true", help="Export Markdown")
    parser.add_argument("--open", action="store_true", help="Open generated markdown in default editor")
    args = parser.parse_args()

    if not args.json and not args.md:
        args.json = True
        args.md = True

    outputs = []
    if args.json:
        outputs.append(export_json())
    if args.md:
        outputs.append(export_markdown())

    for p in outputs:
        print(f"Generated: {p}")

    if args.open:
        mdfile = "COPYRIGHT_MASTER_MORLEY_MOSES_APOOCH.md"
        if os.path.exists(mdfile):
            if sys.platform == "win32":
                os.startfile(mdfile)
            elif sys.platform == "darwin":
                subprocess.run(["open", mdfile])
            else:
                subprocess.run(["xdg-open", mdfile])

if __name__ == "__main__":
    main()
